# Dependency update domains: one uv workspace, one pnpm workspace, two cargo domains.
# Check for version updates monthly. Batch minor and patch updates within each
# domain, but keep major version updates separate for compatibility review.
version: 2
updates:
  # Python workspace: the root uv.lock covers every member under packages/ and apps/.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # JavaScript workspace: the root pnpm-lock.yaml covers the web app, the desktop
  # frontend, shared UI and the shared schema package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      javascript-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Rust workspace: the root Cargo.lock covers apps/desktop and native/wenyi-locks.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      rust-workspace-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Standalone EPUB extension crate with its own tracked Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/packages/core/rust"
    schedule:
      interval: "monthly"
    groups:
      rust-epub-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
