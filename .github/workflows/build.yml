name: CLI packages
run-name: CLI · ${{ inputs.tag || github.event.release.tag_name || format('dev {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (empty means development checkout)
        type: string
        default: ""
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/build.yml
      - scripts/release_version.py
      - scripts/package_release.py
      - packages/core/tests/test_release_packaging.py
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: CLI · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            python_arch: x64
            platform: windows-x64
            binary: ./dist/wenyi.exe
            expected_machine: "8664"
          - name: Linux x64
            runner: ubuntu-latest
            python_arch: x64
            platform: linux-x64
            binary: ./dist/wenyi
            expected_arch: x86-64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python_arch: arm64
            platform: linux-arm64
            binary: ./dist/wenyi
            expected_arch: aarch64
          - name: macOS Apple Silicon
            runner: macos-15
            python_arch: arm64
            platform: macos-arm64
            binary: ./dist/wenyi
            expected_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            python_arch: x64
            platform: macos-x64
            binary: ./dist/wenyi
            expected_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Resolve Git version
        id: version
        shell: bash
        env:
          WENYI_BUILD_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python -m pip install hatch-vcs
          python scripts/release_version.py --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: python -m pip install ./packages/core ./packages/cli pyinstaller

      - name: Build single-file executable
        run: >
          python -m PyInstaller --name wenyi --onefile --clean --noconfirm
          --paths packages/core --paths packages/cli
          --collect-all ebooklib --collect-all bs4 --collect-all lxml
          --collect-all openai --collect-all pydantic --collect-all yaml
          --collect-all wenyi_core --collect-all tiktoken --collect-all tiktoken_ext
          --collect-all docx --collect-all google.genai
          --collect-data wenyi_core.i18n
          --copy-metadata wenyi-core --copy-metadata wenyi-cli
          --workpath build/pyinstaller --specpath build/pyinstaller-spec
          --distpath dist scripts/cli_entry.py

      - name: Smoke test executable
        run: |
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} languages

      - name: Verify packaged CLI version
        shell: bash
        env:
          CLI_EXECUTABLE: ${{ matrix.binary }}
          EXPECTED_PYTHON_VERSION: ${{ steps.version.outputs.python }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(
              [os.environ["CLI_EXECUTABLE"], "--version"], text=True
          ).strip()
          expected = os.environ["EXPECTED_PYTHON_VERSION"]
          if actual != expected:
              raise SystemExit(f"CLI version mismatch: expected {expected}, got {actual}")
          PY

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("${{ matrix.binary }}")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $actual = "{0:X4}" -f $machine
          Write-Host "PE machine: 0x$actual"
          if ($actual -ne "${{ matrix.expected_machine }}") {
            throw "Expected PE machine 0x${{ matrix.expected_machine }}, got 0x$actual"
          }

      - name: Verify Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"

      - name: Verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"
          codesign --verify --deep --strict "${{ matrix.binary }}"

      - name: Package CLI ZIP (including executable permissions)
        run: >
          python scripts/package_release.py cli
          --version "${{ steps.version.outputs.version }}"
          --platform "${{ matrix.platform }}" --source "${{ matrix.binary }}"

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: wenyi-cli-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish CLI assets · ${{ github.event.release.tag_name }}
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: wenyi-cli-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum wenyi-cli-*.zip > wenyi-cli-SHA256SUMS.txt

      - name: Upload assets to published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$TAG" release-assets/* \
            --repo "$GH_REPO"
