name: CLI packages
run-name: CLI · ${{ inputs.tag || github.event.release.tag_name || format('dev {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (empty means development checkout)
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - LICENSE
      - packages/core/LICENSE
      - packages/core/THIRD_PARTY_NOTICES.md
      - packages/cli/LICENSE
      - scripts/release/core_native_notices.py
      - scripts/release/release_version.py
      - scripts/release/package_release.py
      - scripts/release/check_backend_packages.py
      - scripts/release/check_wheel_resources.py
      - scripts/release/check_mineru_cli.py
      - packages/core/wenyi_core/ingest/mineru_epub.py
      - packages/cli/wenyi_cli/commands/workflows.py
      - scripts/dev/cli_entry.py
      - packages/core/tests/test_release_packaging.py
      - packages/core/hatch_build.py
      - packages/core/pyproject.toml
      - packages/core/rust/**
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A pull request only needs one packaging signal; a release or a manual
  # dispatch still builds every platform, so a per-platform break is caught
  # before publishing rather than on every pull request.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # The value must be a single line: a multi-line $GITHUB_OUTPUT entry is
        # rejected by the runner as an invalid output format.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            matrix='[{"name":"Linux x64","runner":"ubuntu-latest","python_arch":"x64","platform":"linux-x64","binary":"./dist/wenyi","expected_arch":"x86-64"}]'
          else
            matrix='[{"name":"Windows x64","runner":"windows-latest","python_arch":"x64","platform":"windows-x64","binary":"./dist/wenyi.exe","expected_machine":"8664"},{"name":"Linux x64","runner":"ubuntu-latest","python_arch":"x64","platform":"linux-x64","binary":"./dist/wenyi","expected_arch":"x86-64"},{"name":"Linux ARM64","runner":"ubuntu-24.04-arm","python_arch":"arm64","platform":"linux-arm64","binary":"./dist/wenyi","expected_arch":"aarch64"},{"name":"macOS Apple Silicon","runner":"macos-15","python_arch":"arm64","platform":"macos-arm64","binary":"./dist/wenyi","expected_arch":"arm64"},{"name":"macOS Intel","runner":"macos-15-intel","python_arch":"x64","platform":"macos-x64","binary":"./dist/wenyi","expected_arch":"x86_64"}]'
          fi
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: CLI · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Resolve Git version
        id: version
        shell: bash
        env:
          WENYI_BUILD_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python -m pip install hatch-vcs
          python scripts/release/release_version.py --github-output "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The wenyi-locks build uses the root workspace target directory, and
          # the pip install below compiles the Core native extension through
          # hatch_build.py into the standalone Core workspace target.
          workspaces: |
            . -> target
            packages/core/rust -> packages/core/rust/target
          # Keep the default per-job and Rust-environment key hashes: the five
          # matrix legs run different platforms and must not share one cache key.
      - name: Install build dependencies
        run: python -m pip install ./packages/core ./packages/cli pyinstaller

      - name: Build the wenyi-locks native library
        shell: bash
        run: |
          cargo build --release -p wenyi-locks
          python - <<'PY'
          import os
          import sys
          name = {
              "win32": "wenyi_locks.dll",
              "darwin": "libwenyi_locks.dylib",
          }.get(sys.platform, "libwenyi_locks.so")
          path = os.path.join("target", "release", name)
          if not os.path.isfile(path):
              raise SystemExit(f"Missing {path}; the cargo build above did not run")
          absolute = os.path.abspath(path)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"LOCKS_LIB={absolute}\n")
          print(f"LOCKS_LIB={absolute}")
          PY
      - name: Build single-file executable
        run: >
          python -m PyInstaller --name wenyi --onefile --clean --noconfirm
          --add-binary "${{ env.LOCKS_LIB }}${{ runner.os == 'Windows' && ';' || ':' }}."
          --collect-all bs4 --collect-all lxml
          --collect-all openai --collect-all pydantic --collect-all yaml
          --collect-all wenyi_core --collect-all tiktoken --collect-all tiktoken_ext
          --collect-all google.genai
          --collect-data wenyi_core.i18n
          --collect-data latex2mathml
          --copy-metadata wenyi-core --copy-metadata wenyi-cli
          --workpath build/pyinstaller --specpath build/pyinstaller-spec
          --distpath dist scripts/dev/cli_entry.py

      - name: Smoke test executable
        shell: bash
        run: |
          python -c "from PyInstaller.archive.readers import CArchiveReader; assert any('_epub_native.' in name for name in CArchiveReader('${{ matrix.binary }}').toc), 'Missing EPUB extension'"
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} languages
          python scripts/release/check_mineru_cli.py "${{ matrix.binary }}"

      - name: Verify packaged CLI version
        shell: bash
        env:
          CLI_EXECUTABLE: ${{ matrix.binary }}
          EXPECTED_PYTHON_VERSION: ${{ steps.version.outputs.python }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(
              [os.environ["CLI_EXECUTABLE"], "--version"], text=True
          ).strip()
          expected = os.environ["EXPECTED_PYTHON_VERSION"]
          if actual != expected:
              raise SystemExit(f"CLI version mismatch: expected {expected}, got {actual}")
          PY

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("${{ matrix.binary }}")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $actual = "{0:X4}" -f $machine
          Write-Host "PE machine: 0x$actual"
          if ($actual -ne "${{ matrix.expected_machine }}") {
            throw "Expected PE machine 0x${{ matrix.expected_machine }}, got 0x$actual"
          }

      - name: Verify Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"

      - name: Verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"
          codesign --verify --deep --strict "${{ matrix.binary }}"

      - name: Package CLI ZIP (including executable permissions)
        run: >
          python scripts/release/package_release.py cli
          --version "${{ steps.version.outputs.version }}"
          --platform "${{ matrix.platform }}" --source "${{ matrix.binary }}"

      - name: Upload packaged executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wenyi-cli-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish CLI assets · ${{ github.event.release.tag_name }}
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wenyi-cli-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum wenyi-cli-*.zip > wenyi-cli-SHA256SUMS.txt

      - name: Upload assets to published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$TAG" release-assets/* \
            --repo "$GH_REPO"
