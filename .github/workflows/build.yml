name: Build executables

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/build.yml
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: wenyi-windows-x64
            binary: ./dist/wenyi.exe
            archive: ./dist/wenyi-windows-x64.zip
          - name: Linux x64
            runner: ubuntu-latest
            artifact: wenyi-linux-x64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-linux-x64.tar.gz
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: wenyi-macos-arm64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-macos-arm64.tar.gz
            expected_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: wenyi-macos-x64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-macos-x64.tar.gz
            expected_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Build single-file executable
        run: >
          python -m PyInstaller --name wenyi --onefile --clean --noconfirm
          --paths . --collect-all ebooklib --collect-all bs4 --collect-all lxml
          --collect-all openai --collect-all pydantic --collect-all yaml
          --copy-metadata trans-novel
          --workpath build/pyinstaller --specpath build/pyinstaller-spec
          --distpath dist trans_novel/__main__.py

      - name: Smoke test executable
        shell: bash
        run: |
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version

      - name: Verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"
          codesign --verify --deep --strict "${{ matrix.binary }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -LiteralPath dist/wenyi.exe
          -DestinationPath dist/wenyi-windows-x64.zip -Force

      - name: Package POSIX executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist wenyi

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: wenyi-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum wenyi-* > SHA256SUMS.txt

      - name: Upload assets to published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$TAG" release-assets/* \
            --repo "$GH_REPO" \
            --clobber
