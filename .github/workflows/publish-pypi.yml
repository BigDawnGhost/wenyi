name: Publish Python packages to PyPI
run-name: PyPI · ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to validate (empty means development checkout; never uploads)
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-pypi.yml
      - LICENSE
      - pyproject.toml
      - uv.lock
      - packages/core/LICENSE
      - packages/core/THIRD_PARTY_NOTICES.md
      - packages/core/pyproject.toml
      - packages/core/README.md
      - packages/core/hatch_build.py
      - packages/core/rust/**
      - packages/cli/LICENSE
      - packages/cli/pyproject.toml
      - packages/cli/hatch_build.py
      - packages/cli/README.md
      - packages/core/tests/test_release_packaging.py
      - packages/core/tests/test_distribution_licenses.py
      - packages/core/tests/test_core_native_notices.py
      - scripts/release/core_native_notices.py
      - scripts/release/core_native_notices.toml
      - scripts/release/release_version.py
      - scripts/release/check_wheel_resources.py
      - scripts/release/smoke_document_formats.py

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # hatch_build.py compiles the Core native extension into this standalone
          # workspace target directory, not the root Desktop workspace target.
          workspaces: packages/core/rust -> packages/core/rust/target
          # Match the desktop workflows: one stable key with no per-job or Rust
          # environment hash, since this job always runs on one Ubuntu image.
          add-job-id-key: false
          add-rust-environment-hash-key: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Validate release identity
        id: version
        env:
          WENYI_BUILD_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --isolated --no-project --python 3.12 --with hatch-vcs \
            python scripts/release/release_version.py --github-output "$GITHUB_OUTPUT"
      - name: Check packaging contracts
        run: |
          cargo fetch --locked --manifest-path packages/core/rust/Cargo.toml
          python scripts/release/core_native_notices.py --check
          uv sync --locked --group dev
          uv run --no-sync pytest -q -n auto packages/core/tests/test_release_packaging.py \
            packages/core/tests/test_distribution_licenses.py packages/core/tests/test_core_native_notices.py
      - name: Build Core and CLI distributions
        run: |
          uv build --no-sources --package wenyi-core --out-dir dist/pypi
          uv build --no-sources --package wenyi-cli --out-dir dist/pypi
          uvx --from twine twine check --strict dist/pypi/*
          uv run --no-sync python scripts/release/check_wheel_resources.py dist/pypi
      - name: Prepare the local smoke-test wheelhouse
        run: |
          wheelhouse="$RUNNER_TEMP/pypi-smoke-wheelhouse"
          requirements="$RUNNER_TEMP/pypi-smoke-requirements.txt"
          uv export --locked --package wenyi-cli --no-dev --no-emit-workspace \
            --no-hashes --quiet --output-file "$requirements"
          python -m pip download --only-binary=:all: --dest "$wheelhouse" \
            --requirement "$requirements" 'hatchling>=1.27' hatch-vcs

          # Model the incompatible published 1.7.2 candidate without fetching it.
          fixture="$RUNNER_TEMP/old-core"
          mkdir -p "$fixture/wenyi_core"
          touch "$fixture/wenyi_core/__init__.py"
          cat > "$fixture/pyproject.toml" <<'TOML'
          [project]
          name = "wenyi-core"
          version = "1.7.2"
          TOML
          hatch_python="$PWD/.venv/bin/python"
          (cd "$fixture" && "$hatch_python" -I -m hatchling build -t wheel -d "$wheelhouse")
      - name: Smoke test CLI-only installations from wheels and source distributions
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.python }}
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -eu
          distributions="$PWD/dist/pypi"
          wheelhouse="$RUNNER_TEMP/pypi-smoke-wheelhouse"
          for extension in whl tar.gz; do
            environment="$RUNNER_TEMP/wenyi-pypi-$extension"
            core_candidates="$RUNNER_TEMP/wenyi-core-$extension"
            mkdir "$core_candidates"
            cp "$distributions"/wenyi_core-*."$extension" "$core_candidates/"
            uv venv "$environment" --python 3.12
            # Prefer the old fixture if the CLI ever stops requiring its paired Core.
            uv pip install --python "$environment/bin/python" --offline --no-index \
              --resolution lowest --prerelease-package wenyi-core=allow \
              --find-links "$wheelhouse" --find-links "$core_candidates" \
              "$distributions"/wenyi_cli-*."$extension"
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I - <<'PY'
          import importlib.util
          import os
          from importlib.metadata import version

          for package in ("wenyi-core", "wenyi-cli"):
              actual = version(package)
              if actual != os.environ["EXPECTED_VERSION"]:
                  raise SystemExit(f"{package}: unexpected version {actual}")
          for module in ("babeldoc", "wenyi_babeldoc_bridge", "wenyi_api", "wenyi_desktop", "docx"):
              if importlib.util.find_spec(module) is not None:
                  raise SystemExit(f"Unexpected CLI dependency: {module}")

          from wenyi_core.i18n.resources import read_text
          from wenyi_core.markup._epub_native import (
              append_about, export, generate, html_present, ingest, parse_docx,
              pdf_write_spreads, render_html_bodies, write_docx,
          )

          if not read_text("tasks/translator_system.txt").strip():
              raise SystemExit("Core translation prompt unavailable")
          if not all(callable(operation) for operation in (
              append_about, export, generate, html_present, ingest, parse_docx,
              pdf_write_spreads, render_html_bodies, write_docx,
          )):
              raise SystemExit("Native document engine unavailable")
          PY
            "$environment/bin/python" -I scripts/release/smoke_document_formats.py
            (
              cd "$RUNNER_TEMP"
              actual_version=$("$environment/bin/wenyi" --version)
              printf 'wenyi %s\n' "$actual_version"
              test "$actual_version" = "$EXPECTED_VERSION"
              "$environment/bin/wenyi" --help
              "$environment/bin/wenyi" translate --help
              "$environment/bin/wenyi" languages
            )
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          # The host Core wheel is for smoke testing; cibuildwheel builds the
          # portable Core wheels that actually go to PyPI.
          path: |
            dist/pypi/*.tar.gz
            dist/pypi/wenyi_cli-*.whl
          if-no-files-found: error
          retention-days: 14

  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
          - { runner: windows-2022, arch: AMD64 }
          - { runner: macos-15-intel, arch: x86_64 }
          - { runner: macos-15, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      # Validate the repaired wheel against the same texts as the producer.
      # cibuildwheel still builds the verified sdist, never this checkout.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/pypi/
      - name: Locate the verified Core source distribution
        id: core
        shell: bash
        run: |
          set -eu
          set -- dist/pypi/wenyi_core-*.tar.gz
          test "$#" -eq 1 && test -f "$1"
          echo "sdist=$1" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3
        with:
          package-dir: ${{ steps.core.outputs.sdist }}
        env:
          CIBW_BUILD: cp310-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="13.0"'
          CIBW_TEST_COMMAND: >-
            python -c "from pathlib import Path; from tempfile import TemporaryDirectory;
            from wenyi_core.markup._epub_native import
            append_about, export, html_present, parse_docx, pdf_write_spreads, render_html_bodies, write_docx;
            from wenyi_core.assemble.epub_package import EpubChapter, EpubTocEntry, write_epub;
            from wenyi_core.ingest.epub_reader import read_epub;
            tmp = TemporaryDirectory(); path = Path(tmp.name) / 'native.epub';
            write_epub(path, title='Native EPUB', lang='en', resources=[],
            chapters=[EpubChapter('chapter.xhtml', 'Chapter', '<html><body><p>Native text</p></body></html>')],
            toc=[EpubTocEntry('chapter.xhtml', 'Chapter')]);
            assert read_epub(path, 'en', 'zh').chapters[-1].segments[-1].source == 'Native text';
            tmp.cleanup()"
      - name: Inspect the portable wheel before upload
        run: python scripts/release/check_wheel_resources.py wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-core-${{ matrix.runner }}
          path: wheelhouse/wenyi_core-*.whl
          if-no-files-found: error
          retention-days: 14

  publish-core:
    if: github.event_name == 'release' && github.repository == 'BigDawnGhost/wenyi'
    needs: [build, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wenyi-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist/pypi/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Publish Core
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/pypi/wenyi_core-*

  publish-cli:
    if: github.event_name == 'release' && github.repository == 'BigDawnGhost/wenyi'
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-cli
      url: https://pypi.org/project/wenyi-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/pypi/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Publish CLI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/pypi/wenyi_cli-*
