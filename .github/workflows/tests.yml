name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A nightly full run is what replaced the unconditional push run (T-35): a
    # stale path filter is caught within a day instead of on every merge. The
    # end-to-end specs and the Docker proxy suite ride along here too.
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      force: ${{ steps.filter.outputs.force }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # A push diffs the before/after commits locally, so this job needs full
      # history on every event that can reach it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Anything that can affect the Python suite. The paths that must never
            # be skipped are not listed here: they set force below instead, so one
            # shared reason can bypass both jobs.
            python:
              - "packages/**"
              - "apps/api/**"
              - "apps/desktop/backend/**"
              - "scripts/**"
            # Anything that can affect typecheck, build or the browser specs.
            web:
              - "apps/web/**"
              - "apps/desktop/frontend/**"
              - "packages/ui/**"
              - "packages/shared-schema/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/api/**"
            # A path whose change can invalidate either filter's assumption: the
            # shared configuration, both lockfiles and the CI definition itself.
            # Touching one runs both jobs regardless of what else changed.
            force:
              - "pyproject.toml"
              - "uv.lock"
              - "config.yaml"
              - ".github/workflows/**"
            # The browser specs exercise the HTTP contract as well as the shared
            # components, so a backend or schema change has to run them.
            e2e:
              - "apps/web/**"
              - "apps/desktop/frontend/**"
              - "packages/ui/**"
              - "packages/shared-schema/**"
              - "apps/api/**"
              - "packages/backend/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  contract:
    # A route or schema edit can break the browser specs without touching any
    # path the filter above watches, so the OpenAPI document is compared on
    # its own. This is a separate job because it installs the workspace, which
    # does not fit the five minutes the filter job is allowed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base revision is read from the same clone.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Compare the HTTP contract with the base revision
        id: compare
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          # A base revision that predates the snapshot script cannot be
          # described, so it counts as changed and the specs run.
          if ! git cat-file -e "$base:scripts/openapi_snapshot.py" 2>/dev/null; then
            echo "No snapshot on the base revision; treating the contract as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv sync --locked --all-packages --group dev --quiet
          uv run --no-sync python scripts/openapi_snapshot.py > "$RUNNER_TEMP/head.json"
          # The workspace is installed in editable mode, so the base tree only
          # needs to win on PYTHONPATH: no second resolve, no second install.
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          PYTHONPATH="$RUNNER_TEMP/base/packages/core:$RUNNER_TEMP/base/packages/backend" \
            uv run --no-sync python "$RUNNER_TEMP/base/scripts/openapi_snapshot.py" \
            > "$RUNNER_TEMP/base.json"
          git worktree remove --force "$RUNNER_TEMP/base"
          if cmp -s "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"; then
            echo "The HTTP contract is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The HTTP contract changed; the browser specs will run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    # A manual or scheduled run is always the full suite. A push and a pull
    # request are both filtered: the merged commit was already tested on the pull
    # request ref, and the nightly run covers what a stale filter could miss.
    # `force` is the paths that invalidate the filter itself.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.changes.outputs.python == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wenyi
          POSTGRES_PASSWORD: wenyi
          POSTGRES_DB: wenyi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wenyi -d wenyi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wenyi:wenyi@localhost:5432/wenyi_test
      WENYI_TEST_DATABASE_URL: postgresql://wenyi:wenyi@localhost:5432/wenyi_test
      REDIS_URL: redis://localhost:6379/0
      WENYI_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Smoke test the default local CLI installation
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wenyi-cli-smoke
        run: |
          uv sync --locked --no-dev --python ${{ matrix.python-version }}
          uv run --no-sync python -m wenyi_cli --version
          uv run --no-sync wenyi --version
          uv run --no-sync wenyi --help
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev --python ${{ matrix.python-version }}
      - name: Prepare token-budget vocabulary
        run: uv run --no-sync python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Python style
        run: |
          uv run --no-sync ruff check packages/core packages/cli packages/backend apps/api apps/desktop/backend scripts
          uv run --no-sync ruff format --check packages/core packages/cli packages/backend apps/api apps/desktop/backend scripts
          git diff --check
      - name: Offline Python regression tests
        # loadgroup keeps tests that share a group on one worker; -n auto sizes
        # to the runner. Only the oldest supported interpreter is narrowed to the
        # core suite (D-4 option A): 3.12 keeps every package, so a compatibility
        # problem in the CLI, backend, API or desktop still surfaces there.
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run --no-sync pytest -q -n auto --dist loadgroup -m "not integration" packages/core/tests
          else
            uv run --no-sync pytest -q -n auto --dist loadgroup -m "not integration"
          fi
      - name: Service integration tests (PostgreSQL and Redis enabled)
        # Two workers bound connections against the shared postgres service.
        # One rerun absorbs resource flake; a retried pass lands in the job
        # summary as flaky rather than disappearing into a green run.
        # The nightly run also enables the Docker proxy suite, which every
        # pull request skips because it needs a running Docker daemon.
        env:
          WENYI_TEST_DOCKER: ${{ github.event_name == 'schedule' && '1' || '0' }}
        # The narrowed 3.10 leg keeps the same scope as its offline run.
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run --no-sync pytest -q -n 2 --dist loadgroup --reruns 1 -m integration packages/core/tests
          else
            uv run --no-sync pytest -q -n 2 --dist loadgroup --reruns 1 -m integration
          fi
      - name: Build distributable packages and verify bundled resources
        if: matrix.python-version == '3.12'
        run: |
          uv build --package wenyi-core
          uv build --package wenyi-cli
          uv build --package wenyi-backend
          uv build --package wenyi-api
          uv build --package wenyi-desktop
          uv run --no-sync python scripts/check_wheel_resources.py dist
          uv run --no-sync python scripts/check_backend_packages.py dist

  web:
    needs: [changes, contract]
    # A manual or scheduled run is always full; a filtered run is decided here.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.force == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/desktop/frontend typecheck
      - run: pnpm -C apps/web typecheck:tests
      - run: pnpm -C apps/desktop/frontend typecheck:tests
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/desktop/frontend build
      - run: pnpm test:frontend-boundaries
      # The browser specs need the built frontends and the installed browsers,
      # so this job hands both over instead of rebuilding them twice.
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: |
            apps/web/dist/
            apps/desktop/frontend/dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [changes, contract, web]
    # The browser specs run when the contract they exercise could have moved:
    # a watched path, a forced path, or an OpenAPI document that no longer
    # matches the base revision. Typecheck and build always run in `web`.
    if: |
      always() &&
      needs.web.result == 'success' &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.e2e == 'true' ||
       needs.changes.outputs.force == 'true' ||
       needs.contract.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both ends go in one matrix so they run side by side: the wall clock is
      # the slower of the two suites instead of their sum.
      matrix:
        include:
          - name: web
            command: pnpm -C apps/web test:e2e
            results: apps/web/test-results/
            report: apps/web/playwright-report/
          - name: desktop
            command: pnpm -C apps/desktop/frontend test:e2e
            results: apps/desktop/frontend/test-results/
            report: apps/desktop/frontend/playwright-report/
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm -C apps/web exec playwright install-deps chromium
      - name: Run the ${{ matrix.name }} specs
        env:
          # Three workers instead of the two a four-core runner derives: the
          # retry-and-report path already catches a flaky pass.
          PLAYWRIGHT_WORKERS: "3"
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results-${{ matrix.name }}
          path: |
            ${{ matrix.results }}
            ${{ matrix.report }}
          if-no-files-found: ignore
  nightly:
    # Not gated on the filter: a scheduled run is always the full sweep. This is
    # the safety net T-35 traded the unconditional push run for: everything the
    # filtered run skips, once a day, on the same commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/desktop/frontend build
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm -C apps/web exec playwright install-deps chromium
      - name: Web end-to-end specs including the performance measurement
        env:
          PLAYWRIGHT_PERF: "1"
          PLAYWRIGHT_WORKERS: "3"
        run: pnpm -C apps/web test:e2e
      - name: Desktop end-to-end specs including the performance measurement
        env:
          PLAYWRIGHT_PERF: "1"
          PLAYWRIGHT_WORKERS: "3"
        run: pnpm -C apps/desktop/frontend test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-nightly-results
          path: |
            apps/web/test-results/
            apps/desktop/frontend/test-results/
          if-no-files-found: ignore
