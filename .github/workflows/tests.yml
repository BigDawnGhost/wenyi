name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # Both downstream jobs need this one, so it must not fail on a push event:
      # paths-filter diffs before..after locally there, which needs full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Anything that can affect the Python suite, plus the paths that must
            # never be skipped: the shared config, the lockfile and CI itself.
            python:
              - "packages/**"
              - "apps/api/**"
              - "apps/desktop/backend/**"
              - "scripts/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/**"
              - "config.yaml"
            # Anything that can affect typecheck, build or the browser specs.
            web:
              - "apps/web/**"
              - "apps/desktop/frontend/**"
              - "packages/ui/**"
              - "packages/shared-schema/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/**"
              - "apps/api/**"
              - "pyproject.toml"
              - "uv.lock"

  python:
    needs: changes
    # Filtering only applies to pull requests: a push to main and a manual run
    # must always execute the full suite, so a wrong filter cannot ship a break.
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wenyi
          POSTGRES_PASSWORD: wenyi
          POSTGRES_DB: wenyi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wenyi -d wenyi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wenyi:wenyi@localhost:5432/wenyi_test
      WENYI_TEST_DATABASE_URL: postgresql://wenyi:wenyi@localhost:5432/wenyi_test
      REDIS_URL: redis://localhost:6379/0
      WENYI_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Smoke test the default local CLI installation
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wenyi-cli-smoke
        run: |
          uv sync --locked --no-dev --python ${{ matrix.python-version }}
          uv run --no-sync python -m wenyi_cli --version
          uv run --no-sync wenyi --version
          uv run --no-sync wenyi --help
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev --python ${{ matrix.python-version }}
      - name: Prepare token-budget vocabulary
        run: uv run --no-sync python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Python style
        run: |
          uv run --no-sync ruff check packages/core packages/cli packages/backend apps/api apps/desktop/backend scripts
          uv run --no-sync ruff format --check packages/core packages/cli packages/backend apps/api apps/desktop/backend scripts
          git diff --check
      - name: Offline Python regression tests
        # loadgroup keeps tests that share a group on one worker; -n auto sizes to the runner.
        run: uv run --no-sync pytest -q -n auto --dist loadgroup -m "not integration"
      - name: Service integration tests (PostgreSQL and Redis enabled)
        # Two workers bound connections against the shared postgres service.
        run: uv run --no-sync pytest -q -n 2 --dist loadgroup -m integration
      - name: Build distributable packages and verify bundled resources
        if: matrix.python-version == '3.12'
        run: |
          uv build --package wenyi-core
          uv build --package wenyi-cli
          uv build --package wenyi-backend
          uv build --package wenyi-api
          uv build --package wenyi-desktop
          uv run --no-sync python scripts/check_wheel_resources.py dist
          uv run --no-sync python scripts/check_backend_packages.py dist

  web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/desktop/frontend typecheck
      - run: pnpm -C apps/web typecheck:tests
      - run: pnpm -C apps/desktop/frontend typecheck:tests
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/desktop/frontend build
      - run: pnpm test:frontend-boundaries
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm -C apps/web exec playwright install-deps chromium
      - run: pnpm -C apps/web test:e2e
      - run: pnpm -C apps/desktop/frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/desktop/frontend/test-results/
          if-no-files-found: ignore
