# Run Ruff before commits: fix lint issues, including import order, then format.
# Enable once with: uv run pre-commit install
# The Ruff version is pinned once in pyproject.toml (dev group); these local
# hooks run that same pinned Ruff, so there is no separate hook revision to bump.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
