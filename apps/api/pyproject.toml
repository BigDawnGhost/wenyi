[project]
name = "wenyi-api"
dynamic = ["version"]
description = "Web API and background workers for Wenyi's translation engine."
requires-python = ">=3.10"
dependencies = [
    "wenyi-backend",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "arq>=0.26",
    "redis>=5.0",
]

[project.optional-dependencies]
pdf-output = ["wenyi-core[pdf-output]"]
pdf-output-lite = ["wenyi-core[pdf-output-lite]"]

[tool.uv.sources]
wenyi-backend = { workspace = true }
wenyi-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["wenyi_api"]
