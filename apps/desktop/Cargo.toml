[package]
name = "wenyi-desktop"
# Internal crate identity only. build.rs resolves the application version from Git.
version = "0.0.0"
description = "Local desktop application for Wenyi."
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
same-file = "1"
cap-std = "3"
cap-fs-ext = "3"
rfd = "0.15"
semver = "1"
open = "5"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
