[project]
name = "wenyi-desktop"
dynamic = ["version"]
description = "Local desktop backend and private loopback server for Wenyi."
requires-python = ">=3.10"
dependencies = [
    "wenyi-backend",
    "uvicorn[standard]>=0.30",
    "keyring>=25",
]

[tool.uv.sources]
wenyi-backend = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../../.."

[tool.hatch.build.targets.wheel]
packages = ["wenyi_desktop"]
