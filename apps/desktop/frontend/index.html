<!doctype html>
<html lang="en">
  <head>
    <script>
      // Retain lifecycle events even before the module graph and React load.
      for (const kind of ["error", "closing"]) {
        window.addEventListener(`wenyi:desktop-${kind}`, (event) => {
          window.__WENYI_DESKTOP_STATUS__ = kind;
          if (kind === "error") window.__WENYI_DESKTOP_ERROR__ = String(event.detail || "Local service failed.");
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../../packages/ui/src/assets/wenyi-emblem.png" />
    <title>Wenyi — AI translation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
