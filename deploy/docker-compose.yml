# Run from deploy/: docker compose up -d --build
# Starts Web, API, both workers, PostgreSQL, and Redis by default.
x-app: &app
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgresql://wenyi:wenyi@postgres:5432/wenyi
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    WENYI_CONFIG: /app/config.yaml
  volumes:
    - data:/data
    - ${WENYI_CONFIG_FILE:-../config.yaml}:/app/config.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wenyi
      POSTGRES_PASSWORD: wenyi
      POSTGRES_DB: wenyi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wenyi -d wenyi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: api
      args:
        WENYI_VERSION: ${WENYI_VERSION:-0.0.0+docker}
        INSTALL_PDF_OUTPUT: ${INSTALL_PDF_OUTPUT:-true}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.15}
    ports:
      - "8000:8000"

  worker:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: worker
      args:
        WENYI_VERSION: ${WENYI_VERSION:-0.0.0+docker}
        INSTALL_PDF_OUTPUT: ${INSTALL_PDF_OUTPUT:-true}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.15}
    command: [arq, wenyi_api.workers.WorkerSettings]

  export-worker:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: worker
      args:
        WENYI_VERSION: ${WENYI_VERSION:-0.0.0+docker}
        INSTALL_PDF_OUTPUT: ${INSTALL_PDF_OUTPUT:-true}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.15}
    command: [arq, wenyi_api.workers.ExportWorkerSettings]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  data:
