  <title id="title">Whole-book translation sequence</title>
  <desc id="desc">Batches reuse context and glossary mappings. Translation and term extraction have separate checkpoints. Review gathers evidence and revises a shadow copy; Autofix journals and verifies changes before publishing.</desc>
