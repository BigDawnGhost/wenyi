    <text class="message" x="387.5" y="129">Save preparation results</text>
    <text class="keyword" x="25" y="164">loop</text>
    <text class="guard" x="81" y="164">[batches in source order]</text>
    <text class="message" x="387.5" y="185">Read batch progress and recent translations</text>
    <text class="message" x="387.5" y="214">Saved segments and extraction checkpoint</text>
    <text class="keyword" x="32" y="249">opt</text>
    <text class="guard" x="88" y="249">[translation pending]</text>
    <text class="message" x="298" y="270">Read all current mappings</text>
    <text class="keyword" x="39" y="305">alt</text>
    <text class="guard" x="95" y="305">[standard translation]</text>
    <text class="message" x="195.5" y="326">Translate in context</text>
    <text class="message" x="195.5" y="355">Translated segments</text>
    <text class="keyword" x="46" y="390">opt</text>
    <text class="guard" x="102" y="390">[polishing enabled]</text>
    <text class="message" x="195.5" y="411">Polish the draft</text>
    <text class="message" x="195.5" y="440">Polished segments</text>
    <text class="guard" x="42" y="485">[three-draft synthesis]</text>
    <text class="message" x="195.5" y="507">Draft 3 times in parallel</text>
    <text class="message" x="195.5" y="536">Three independent drafts</text>
    <text class="message" x="195.5" y="565">Synthesize with source</text>
    <text class="message" x="195.5" y="594">Synthesized translation</text>
    <text class="message" x="387.5" y="633">Validate segment count, then save targets</text>
    <text class="keyword" x="32" y="678">opt</text>
