    <marker id="solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="m0 0 8 4-8 4z" fill="currentColor"/></marker>
