    <text class="message" x="195.5" y="699">Extract from aligned pairs</text>
    <text class="message" x="195.5" y="728">Terms and translations</text>
    <text class="message" x="298" y="757">Add mappings; record conflicting names</text>
    <text class="message" x="387.5" y="786">Checkpoint term extraction</text>
    <text class="keyword" x="25" y="841">opt</text>
    <text class="guard" x="81" y="841">[all chapters translated and Review enabled]</text>
    <text class="message" x="478.5" y="862">Start whole-book review</text>
    <text class="message" x="690.5" y="891">Read the final glossary snapshot</text>
    <text class="message" x="780" y="920">Read aligned text</text>
    <text class="keyword" x="251" y="955">loop</text>
    <text class="guard" x="307" y="955">[review rounds within budget]</text>
    <text class="message" x="588" y="976">Check passages against the final glossary</text>
    <text class="keyword" x="258" y="1011">opt</text>
    <text class="guard" x="314" y="1011">[more evidence needed]</text>
    <text class="message" x="588" y="1032">Request supporting passages</text>
    <text class="message" x="588" y="1061">Source and target excerpts</text>
    <text class="message" x="588" y="1100">Candidate issues and supporting evidence</text>
    <text class="message" x="588" y="1129">Arbitrate conflicting recommendations</text>
    <text class="keyword" x="258" y="1164">opt</text>
    <text class="guard" x="314" y="1164">[shadow revisions enabled]</text>
    <text class="message" x="588" y="1185">Draft fixes against the round snapshot</text>
    <text class="message" x="588" y="1214">Patches for the shadow copy only</text>
    <text class="message" x="478.5" y="1263">Review report and proposed revisions</text>
    <text class="keyword" x="32" y="1298">opt</text>
    <text class="guard" x="88" y="1298">[Autofix enabled and revisions ready]</text>
    <text class="message" x="571" y="1319">Publish reviewed changes</text>
    <text class="message" x="872.5" y="1348">Journal patches and expected targets</text>
