[project]
name = "wenyi-cli"
dynamic = ["version", "dependencies"]
description = "Local command-line interface for Wenyi's translation engine."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/BigDawnGhost/wenyi"
Documentation = "https://github.com/BigDawnGhost/wenyi/blob/main/docs/guide/cli.md"

[project.scripts]
wenyi = "wenyi_cli.main:main"

[tool.uv]
# Refresh both editable distributions together when their SCM or packaging inputs change.
cache-keys = [
    { git = { commit = true, tags = true } },
    { file = "../cli/pyproject.toml" },
    { file = "../cli/hatch_build.py" },
    { file = "../core/pyproject.toml" },
    { file = "../core/hatch_build.py" },
]

[tool.uv.sources]
wenyi-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.metadata.hooks.custom]
dependencies = ["typer>=0.12", "rich>=13.7"]

[tool.hatch.build.targets.wheel]
packages = ["wenyi_cli"]
