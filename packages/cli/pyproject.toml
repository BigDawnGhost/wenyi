[project]
name = "wenyi-cli"
dynamic = ["version"]
description = "Local command-line interface for Wenyi's translation engine."
requires-python = ">=3.10"
dependencies = [
    "wenyi-core",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
wenyi = "wenyi_cli.main:main"

[tool.uv.sources]
wenyi-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["wenyi_cli"]
