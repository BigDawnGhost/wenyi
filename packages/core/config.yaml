# Legacy trans-novel configuration for translating multilingual novels into Chinese.
# Model providers, pipeline settings and output options are configured here.

language:
  source: auto # Detect the source language with the model, or specify ja / en / ko / ru / de.
  target: zh # Translation target language.

# ── LLM ──────────────────────────────────────────────────────────────────
llm:
  # deepseek | openai | openrouter | openai-compatible | ollama | vllm | fake
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  timeout: 600
  max_retries: 4
  tiers:
    strong:
      model: deepseek-v4-pro
      options:
        thinking: true
        reasoning_effort: high
    cheap:
      model: deepseek-v4-flash
      options:
        thinking: true
        reasoning_effort: high
    fast:
      model: deepseek-v4-flash
      options:
        thinking: false

# Segmentation.
segment:
  # Target size of a translation batch, using character counts to approximate tokens.
  max_chars_per_batch: 1800
  # Split long paragraphs at sentence boundaries; merge continuations during backfill.
  max_chars_per_segment: 1200

# Pipeline options balancing quality and cost.
pipeline:
  review: true # Review omissions, mistranslations, terminology and references.
  autofix_severe: false # Legacy severe-issue retranslation switch; false reports issues only.
  align_retry_limit: 2
  polish: true # Polish with the strong tier; an additional pass increases model cost.
  backtranslate_sample: 0 # Legacy backtranslation sampling ratio; 0 disables sampling.
  consistency_qa: false # Legacy cross-chapter consistency scan after translation.
  rolling_context_segments: 6 # Number of preceding translated segments included as context.
  book_understanding: true # Prescan the source for a book synopsis and chapter digests.
  prescan_concurrency: 4 # Concurrent chapter-digest workers; 1 runs serially.
  review_concurrency: 4 # Concurrent review workers using fixed text and glossary snapshots.
  glossary_scope: chapter # chapter: relevant chapter terms; full: the entire glossary.

# Honorific policy, primarily for Japanese source text.
honorific:
  # keep_style: retain tone; normalize: apply a consistent policy; drop: omit honorifics.
  strategy: keep_style

# Normalize punctuation to standard full-width Simplified Chinese forms.
punctuation:
  normalize: true

# Paths.
paths:
  state_dir: state # Run state, intermediate chapter data and glossary.

# Monolingual and bilingual output.
output:
  mono: true # Produce a Chinese translation: <title>.zh.epub.
  bilingual: false # Produce a source/translation edition: <title>.zh-bi.epub.
  bilingual_order: target_first # target_first: translation first; source_first: source first.
  about_page: true # Append an About This Translation page.
