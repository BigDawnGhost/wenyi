[project]
name = "wenyi-core"
dynamic = ["version"]
description = "Shared translation engine for multilingual long-form documents."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "pypdf>=6.14.2",
    "google-genai>=2.13.0",
    "json-repair>=0.61,<1",
    "tiktoken>=0.14.0",
]

[project.urls]
Repository = "https://github.com/BigDawnGhost/wenyi"
Documentation = "https://github.com/BigDawnGhost/wenyi/blob/main/docs/development/architecture.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["wenyi_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/wenyi_core",
    "/rust/Cargo.toml",
    "/rust/Cargo.lock",
    "/rust/build.rs",
    "/rust/src",
    "/hatch_build.py",
]

[tool.hatch.build.targets.wheel.hooks.custom]
