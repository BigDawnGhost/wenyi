[package]
name = "wenyi-core-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "GPL-3.0-only"

# Standalone so the Core sdist can build without the Desktop workspace.
[workspace]

[lib]
# Preserve the wenyi_core.markup._epub_native Python import path.
name = "_epub_native"
crate-type = ["cdylib"]

[features]
panic-injection = []

[dependencies]
anyhow = "1"
base64 = "0.22"
chardetng = "1"
encoding_rs = "0.8"
html5ever = "0.39"
indexmap = { version = "2", features = ["serde"] }
lopdf = { version = "=0.47.0", default-features = false }
percent-encoding = "2"
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
quick-xml = "=0.41.0"
rayon = "1"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "=2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[build-dependencies]
pyo3-build-config = "=0.29.2"
