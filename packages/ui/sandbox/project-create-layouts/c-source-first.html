<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C · 原文优先 · 创建项目</title>
  <style>
    :root { color-scheme: light; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; color: #202225; background: #f2f3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; color: inherit; }
    button, select, input[role="switch"] { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #686e77; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .preview-shell { max-width: 1040px; margin: 36px auto; padding: 0 28px; color: #6e737c; }
    .preview-shell nav { display: flex; gap: 20px; margin: 20px 0; }
    a { color: inherit; text-underline-offset: 4px; }
    dialog { width: min(720px, calc(100vw - 40px)); max-height: calc(100dvh - 40px); margin: auto; padding: 0; border: 1px solid #e2e4e8; border-radius: 12px; background: white; box-shadow: 0 20px 70px #181b2533; }
    dialog::backdrop { background: #20232866; backdrop-filter: blur(3px); }
    form { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100dvh - 42px); }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #e7e8eb; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.4px; }
    .close { width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #7b8089; font-size: 24px; line-height: 1; }
    .close:hover { background: #f3f4f6; }
    .body { overflow: auto; padding: 22px 24px; }
    input[type="text"], select { width: 100%; min-width: 0; height: 36px; padding: 0 11px; border: 1px solid #dfe2e7; border-radius: 7px; background: white; box-shadow: 0 1px 2px #20222505; }
    input::placeholder { color: #999da5; }
    input[readonly] { color: #777d87; background: #fafbfc; }
    .dropzone { display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 16px; border: 1px dashed #d7dbe2; border-radius: 9px; background: #f8f9fb; }
    .dropzone[data-dragging="true"] { border-color: #34383f; background: #f1f3f6; }
    .file-icon { display: grid; width: 36px; height: 40px; flex: 0 0 36px; place-items: center; color: #7c8592; }
    .icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .file-icon .icon { width: 25px; height: 25px; }
    .file-copy { min-width: 0; flex: 1; }
    .file-title { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { margin-top: 3px; color: #8b9099; font-size: 11px; }
    .button { display: inline-flex; min-height: 35px; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border: 1px solid #dfe2e7; border-radius: 7px; background: white; white-space: nowrap; }
    .button:hover:not(:disabled) { background: #f7f8fa; }
    .button.primary { border-color: #202225; background: #202225; color: white; }
    .button.primary:disabled { border-color: #d2d5da; background: #d2d5da; }
    .settings { margin-top: 15px; }
    .settings-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 18px; min-height: 55px; padding: 9px 0; border-bottom: 1px solid #eef0f3; }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row > label, .row-label { color: #606773; font-size: 13px; }
    .direction { display: grid; grid-template-columns: 1fr 18px 1fr; align-items: center; gap: 12px; }
    .arrow { color: #9297a0; text-align: center; }
    .location-control { display: flex; min-width: 0; gap: 8px; }
    .location-control .button { flex-shrink: 0; }
    .style-select { max-width: 200px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; margin-top: 17px; padding: 14px 16px; border: 1px solid #e9ecf1; border-radius: 8px; background: #fafbfc; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 13px; }
    .toggle:first-child { padding-right: 20px; }
    .toggle + .toggle { padding-left: 20px; border-left: 1px solid #e1e5eb; }
    input[role="switch"] { position: relative; width: 32px; height: 18px; flex-shrink: 0; margin: 0; appearance: none; border: 0; border-radius: 20px; background: #e2e5e9; transition: background .15s; }
    input[role="switch"]::after { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px #0002; content: ""; transition: transform .15s; }
    input[role="switch"]:checked { background: #202225; }
    input[role="switch"]:checked::after { transform: translateX(14px); }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 24px; border-top: 1px solid #e7e8eb; }
    .preview-hint { color: #999da5; font-size: 11px; }
    .actions { display: flex; gap: 9px; }
    .notice { display: block; margin-top: 14px; color: #696f79; font-size: 12px; overflow-wrap: anywhere; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 600px) {
      .settings-row { grid-template-columns: 1fr; gap: 7px; }
      .options { grid-template-columns: 1fr; gap: 16px; }
      .toggle:first-child { padding-right: 0; }
      .toggle + .toggle { padding-left: 0; border-left: 0; }
      .preview-hint { display: none; }
      .footer { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="preview-shell">
    <strong>Wenyi · C / 原文优先</strong>
    <nav aria-label="布局预览"><a href="index.html">全部方案</a><a href="a-compact.html">A 紧凑单栏</a><a href="b-split.html">B 左右双栏</a></nav>
    <button class="button" id="reopen" type="button">重新打开预览</button>
  </div>
  <svg style="display:none" aria-hidden="true">
    <symbol id="upload-icon" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></symbol>
    <symbol id="folder-icon" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v12H3z"/></symbol>
  </svg>
  <dialog aria-labelledby="dialog-title">
    <form id="project-form" novalidate>
      <header class="dialog-header">
        <h1 id="dialog-title">创建项目</h1>
        <button class="close" type="button" data-close aria-label="关闭">×</button>
      </header>
      <div class="body">
        <div id="source-zone" class="dropzone" role="group" aria-label="原文文件选择区域">
          <span class="file-icon"><svg class="icon" aria-hidden="true"><use href="#upload-icon"/></svg></span>
          <div class="file-copy">
            <div id="source-title" class="file-title">拖入原文，自动填入项目名称</div>
            <div id="source-meta" class="file-meta">EPUB · FB2 · TXT · Markdown · HTML · PDF · DOCX</div>
          </div>
          <input id="source-file" class="sr-only" type="file" accept=".epub,.fb2,.txt,.text,.md,.markdown,.html,.htm,.pdf,.docx" aria-label="上传原文" tabindex="-1">
          <button class="button" id="browse-source" type="button">浏览文件</button>
        </div>
        <div class="settings">
          <div class="settings-row">
            <label for="project-name">项目名称</label>
            <input id="project-name" name="project_name" type="text" placeholder="选择文件后自动填写，也可自行输入" autocomplete="off" autofocus>
          </div>
          <div class="settings-row">
            <span class="row-label" id="direction-heading">翻译方向</span>
            <div class="direction" role="group" aria-labelledby="direction-heading">
              <label class="sr-only" for="source-language">源语言</label>
              <select id="source-language" name="source_lang"><option value="auto">自动检测</option><option value="en">英语 (en)</option><option value="ja">日语 (ja)</option><option value="zh">中文 (zh)</option></select>
              <span class="arrow" aria-hidden="true">→</span>
              <label class="sr-only" for="target-language">目标语言</label>
              <select id="target-language" name="target_lang"><option value="zh">中文 (zh)</option><option value="en">英语 (en)</option><option value="ja">日语 (ja)</option></select>
            </div>
          </div>
          <div class="settings-row">
            <label for="prompt-genre">翻译风格</label>
            <select id="prompt-genre" class="style-select" name="prompt_genre"><option value="literary">文学</option><option value="academic">学术</option></select>
          </div>
          <div id="pdf-settings" class="settings-row" hidden>
            <label for="pdf-backend">PDF 解析器</label>
            <select id="pdf-backend"><option value="">使用默认设置</option><option value="mineru">MinerU</option><option value="babeldoc">BabelDOC</option></select>
          </div>
          <div class="settings-row">
            <label for="project-location">项目文件夹</label>
            <div class="location-control">
              <input id="project-location" type="text" value="文译的默认文件夹" readonly>
              <button class="button" id="choose-location" type="button" aria-label="选择文件夹"><svg class="icon" aria-hidden="true"><use href="#folder-icon"/></svg>更改</button>
            </div>
          </div>
        </div>
        <div class="options">
          <label class="toggle">三译合润<input id="precision" name="precision" type="checkbox" role="switch"></label>
          <label class="toggle">创建后执行译前准备<input id="prepare" name="prepare" type="checkbox" role="switch"></label>
        </div>
        <output id="notice" class="notice" aria-live="polite" hidden></output>
      </div>
      <footer class="footer">
        <span class="preview-hint">布局预览 · 不会上传文件</span>
        <div class="actions"><button class="button" type="button" data-close>取消</button><button class="button primary" id="create" type="submit" disabled>创建项目</button></div>
      </footer>
    </form>
  </dialog>
  <script>
    // This standalone prototype never reads file contents, uploads data or persists settings.
    const dialog = document.querySelector("dialog");
    const form = document.querySelector("form");
    const byId = (id) => document.getElementById(id);
    const nameInput = byId("project-name");
    const fileInput = byId("source-file");
    const zone = byId("source-zone");
    const create = byId("create");
    let source = null;
    function notify(message) {
      byId("notice").textContent = message;
      byId("notice").hidden = false;
    }
    function refresh() {
      const sameLanguage = byId("source-language").value === byId("target-language").value;
      create.disabled = !source || !nameInput.value.trim() || sameLanguage;
      if (sameLanguage) notify("源语言和目标语言不能相同。");
      else byId("notice").hidden = true;
    }
    function choose(file) {
      if (!file) return;
      const extension = file.name.split(".").pop().toLowerCase();
      if (!file.size || !fileInput.accept.split(",").includes("." + extension)) {
        notify("请选择支持格式的非空原文文件。");
        return;
      }
      source = file;
      byId("source-title").textContent = file.name;
      byId("source-meta").textContent = `${extension.toUpperCase()} · ${new Intl.NumberFormat("zh-CN").format(file.size)} B`;
      byId("browse-source").textContent = "更换文件";
      byId("pdf-settings").hidden = extension !== "pdf";
      if (!nameInput.value.trim()) nameInput.value = file.name.replace(/\.[^.]+$/, "") || file.name;
      refresh();
    }
    byId("browse-source").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => choose(fileInput.files[0]));
    form.addEventListener("input", refresh);
    form.addEventListener("change", (event) => {
      if (event.target !== fileInput) refresh();
    });
    for (const type of ["dragenter", "dragover"]) zone.addEventListener(type, (event) => {
      event.preventDefault();
      zone.dataset.dragging = "true";
    });
    zone.addEventListener("dragleave", () => delete zone.dataset.dragging);
    zone.addEventListener("drop", (event) => {
      event.preventDefault();
      delete zone.dataset.dragging;
      const files = event.dataTransfer.files;
      if (files.length !== 1) notify("一次只能选择一个原文文件。");
      else choose(files[0]);
    });
    byId("choose-location").addEventListener("click", () => notify("布局预览：正式应用中会打开系统文件夹选择器。"));
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!create.disabled) notify(`预览完成：「${nameInput.value.trim()}」。没有创建项目或上传文件。`);
    });
    document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", () => dialog.close()));
    byId("reopen").addEventListener("click", () => dialog.showModal());
    dialog.showModal();
  </script>
</body>
</html>
