[project]
name = "wenyi"
dynamic = ["version"]
description = "Wenyi workspace for multilingual long-form translation."
requires-python = ">=3.10"
dependencies = ["wenyi-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/backend", "apps/api", "apps/desktop/backend"]

[tool.uv.sources]
wenyi-core = { workspace = true }
wenyi-cli = { workspace = true }
wenyi-backend = { workspace = true }
wenyi-api = { workspace = true }
wenyi-desktop = { workspace = true }

# Resolve dynamic workspace metadata without installing a root package.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml"]

[dependency-groups]
dev = [
    "hatch-vcs>=0.5", # Exercise the same tag-derived versioning used by package builds.
    "httpx2>=2.13", # Starlette's TestClient HTTP transport.
    "pre-commit>=3.7",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-rerunfailures>=14",
    "pytest-xdist>=3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/backend/tests", "apps/api/tests", "apps/desktop/backend/tests"]
pythonpath = ["packages/core", "packages/cli"]
addopts = "--strict-markers"
markers = [
    "integration: requires isolated PostgreSQL/Redis or opt-in Docker test services",
]
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated",
]
