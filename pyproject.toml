[project]
name = "wenyi"
dynamic = ["version"]
description = "Wenyi workspace for multilingual long-form translation."
requires-python = ">=3.10"
dependencies = ["wenyi-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "apps/api"]

[tool.uv.sources]
wenyi-core = { workspace = true }
wenyi-cli = { workspace = true }
wenyi-api = { workspace = true }

[project.optional-dependencies]
pdf-output = [
    "weasyprint>=69.0",
]
pdf-output-lite = [
    "fpdf2>=2.8.5",
]

# Resolve dynamic workspace metadata without installing a root package.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml"]

[dependency-groups]
dev = [
    "httpx2>=2.13", # Starlette's TestClient HTTP transport.
    "pre-commit>=3.7",
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests"]
pythonpath = ["packages/core", "packages/cli"]
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated",
]
