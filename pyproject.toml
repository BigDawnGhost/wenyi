[project]
name = "trans-novel"
version = "1.3.0"
description = "多 Agent 协同长篇小说翻译系统（多语言到中文），维护专有名词对照表以保证一致性、减少漏译。"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",        # DeepSeek（OpenAI 兼容）调用
    "pydantic>=2.7",       # 模型 / 配置校验
    "pyyaml>=6.0",         # 读取 config.yaml
    "tenacity>=8.2",       # LLM 调用重试/退避
    "beautifulsoup4>=4.12", # EPUB 正文块提取
    "lxml>=5.0",           # bs4 的 XHTML 解析后端
    "ebooklib>=0.18",      # EPUB 读写
    "typer>=0.12",         # CLI
    "rich>=13.7",          # 表格 / 进度条
    "tinycss2==1.4.0",      # EPUB 主题 CSS 解析
]

[project.scripts]
trans-novel = "trans_novel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trans_novel"]

[tool.hatch.build.targets.wheel.force-include]
"trans_novel/config.example.yaml" = "trans_novel/config.example.yaml"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=3.7",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F Pyflakes, I import 排序；其余为 Ruff 推荐的常用质量规则
select = ["E", "W", "F", "I", "B", "C4", "PIE", "RUF", "SIM", "TID", "UP"]
# 超长行主要是中文 prompt 字面量；中文标点不是歧义字符
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
# 包内也必须使用绝对导入；相对 import 一律按错误处理
ban-relative-imports = "all"
