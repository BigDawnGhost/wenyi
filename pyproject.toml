[project]
name = "trans-novel"
dynamic = ["version"]
description = "A multi-agent long-form novel translation system with context, terminology, polishing, and review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",        # OpenAI-compatible provider calls
    "pydantic>=2.7",       # Model and configuration validation
    "pyyaml>=6.0",         # Read config.yaml
    "tenacity>=8.2",       # LLM retry and backoff
    "beautifulsoup4>=4.12", # EPUB content extraction
    "httpx>=0.27",         # HTTP client for PDF conversion services
    "lxml>=5.0",           # XHTML parser for Beautiful Soup
    "ebooklib>=0.18",      # EPUB reading and writing
    "typer>=0.12",         # CLI
    "rich>=13.7",          # Tables and progress bars
    "json-repair>=0.61,<1", # Local repair of malformed model JSON
    "pypdf>=6.14.2",
    "google-genai>=2.13.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
pdf-output = [
    "weasyprint>=69.0",
]
pdf-output-lite = [
    "fpdf2>=2.8.5",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle; F: Pyflakes; I: import sorting
select = ["E", "W", "F", "I"]
# Long lines are mostly string literals, which the formatter does not split.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
trans-novel = "trans_novel.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["trans_novel"]
